<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Responsabilidades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="programa.css">
</head>
<body>
  <main class="page">
    <header>
      <h1>Responsabilidades</h1>
    </header>

    <section class="shell">
      <div class="shell-inner">
        <div class="section-head">
          <h2>Responsabilidades</h2>
          <span id="count-responsabilidades">Cargando…</span>
        </div>
        <div id="responsabilidades" class="weeks resp-grid"></div>

        <div class="section-head sep">
          <h2>Tareas</h2>
          <span id="count-tareas">Cargando…</span>
        </div>
        <div id="tareas" class="weeks resp-grid"></div>
      </div>
    </section>
  </main>

  <noscript>
    <div style="max-width:1000px;margin:1rem auto;font-size:.95rem;color:#6f6f6f;text-align:center;">
      Necesitás JavaScript activado para ver las responsabilidades.
    </div>
  </noscript>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQovGDewyfzRnsAQbWFYWe1tQsYv8GmF1ryp96A0gkEnkburswMIk8u2XR7COWv0Vi2DeYvRGmoLHAy/pub?gid=48772690&single=true&output=csv";

    const respEl = document.getElementById("responsabilidades");
    const tareasEl = document.getElementById("tareas");
    const countRespEl = document.getElementById("count-responsabilidades");
    const countTareasEl = document.getElementById("count-tareas");

    /* --- LOGICA PURA (testeable) : inicio --- */

    function cleanText(value) {
      if (value == null) return "";
      return String(value).replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizarTexto(str) {
      return cleanText(str)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    // CSV tipo RFC4180: soporta comillas, comas y saltos dentro de campos.
    function parseCsv(text) {
      const filas = [];
      let fila = [];
      let campo = "";
      let enComillas = false;
      const src = String(text).replace(/^\uFEFF/, "");

      for (let i = 0; i < src.length; i++) {
        const c = src[i];

        if (enComillas) {
          if (c === '"') {
            if (src[i + 1] === '"') { campo += '"'; i++; }
            else enComillas = false;
          } else {
            campo += c;
          }
          continue;
        }

        if (c === '"') enComillas = true;
        else if (c === ",") { fila.push(campo); campo = ""; }
        else if (c === "\n") { fila.push(campo); filas.push(fila); fila = []; campo = ""; }
        else if (c === "\r") { /* ignorar */ }
        else campo += c;
      }

      if (campo !== "" || fila.length) {
        fila.push(campo);
        filas.push(fila);
      }

      return filas;
    }

    // La hoja trae dos tablas con el mismo encabezado (col 0 + Titular/Auxiliar/Supervisor).
    // Cada fila de encabezado abre un bloque nuevo hasta el próximo encabezado o el fin.
    function extraerResponsabilidades(filas) {
      const bloques = { responsabilidades: [], tareas: [] };
      let destino = null;

      for (const fila of filas) {
        const etiqueta = normalizarTexto(fila[0]);

        if (etiqueta === "responsabilidad" || etiqueta === "tarea") {
          destino = etiqueta === "tarea" ? bloques.tareas : bloques.responsabilidades;
          continue;
        }

        if (!destino) continue;

        const nombre = cleanText(fila[0]);
        if (!nombre) continue;

        destino.push({
          nombre,
          titular: cleanText(fila[1]),
          auxiliar: cleanText(fila[2]),
          supervisor: cleanText(fila[3])
        });
      }

      return bloques;
    }

    /* --- LOGICA PURA : fin --- */

    function renderAsignacion(item) {
      const roles = [];
      if (item.titular) roles.push({ role: "Titular", name: item.titular });
      if (item.auxiliar) roles.push({ role: "Auxiliar", name: item.auxiliar });
      if (item.supervisor) roles.push({ role: "Supervisor", name: item.supervisor });

      return `
        <article class="week-card">
          <div class="week-title">${escapeHtml(item.nombre)}</div>
          <div class="resp-roles">
            ${roles.map(l => `
              <div class="resp-cell">
                <span class="assign-role">${escapeHtml(l.role)}</span>
                <span class="assign-name">${escapeHtml(l.name)}</span>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function renderBloque(items) {
      return items.map(renderAsignacion).join("");
    }

    function renderError(mensaje) {
      countRespEl.textContent = "Error";
      countTareasEl.textContent = "Error";
      respEl.innerHTML = `<p class="empty-msg">${escapeHtml(mensaje)}</p>`;
      tareasEl.innerHTML = "";
    }

    async function cargar() {
      countRespEl.textContent = "Cargando…";
      countTareasEl.textContent = "Cargando…";
      respEl.innerHTML = "";
      tareasEl.innerHTML = "";

      let csv;
      try {
        const response = await fetch(CSV_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        csv = await response.text();
      } catch (err) {
        // Abierto como file:// el navegador bloquea el fetch (Google no manda CORS al redirect).
        const local = window.location.protocol === "file:";
        renderError(local
          ? "Para ver las responsabilidades localmente hay que servirlo por HTTP (por ejemplo: python3 -m http.server en la carpeta del sitio)."
          : "No pude cargar las responsabilidades. Verificá que la planilla siga publicada.");
        return;
      }

      const bloques = extraerResponsabilidades(parseCsv(csv));

      if (!bloques.responsabilidades.length && !bloques.tareas.length) {
        countRespEl.textContent = "0";
        countTareasEl.textContent = "0";
        respEl.innerHTML = `<p class="empty-msg">No encontré responsabilidades en la planilla.</p>`;
        return;
      }

      countRespEl.textContent = String(bloques.responsabilidades.length);
      countTareasEl.textContent = String(bloques.tareas.length);
      respEl.innerHTML = renderBloque(bloques.responsabilidades);
      tareasEl.innerHTML = renderBloque(bloques.tareas);
    }

    cargar();
  </script>
</body>
</html>
