<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Grupos para el servicio del campo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="programa.css">
</head>
<body>
  <main class="page">
    <header>
      <h1>Grupos para el servicio del campo</h1>
    </header>

    <section class="shell">
      <div class="shell-inner">
        <div class="section-head">
          <h2>Grupos</h2>
          <span id="count-resumen">Cargando…</span>
        </div>

        <p id="view-message" class="view-message"></p>

        <div id="groups" class="weeks"></div>
      </div>
    </section>
  </main>

  <noscript>
    <div style="max-width:1000px;margin:1rem auto;font-size:.95rem;color:#6f6f6f;text-align:center;">
      Necesitás JavaScript activado para ver los grupos.
    </div>
  </noscript>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQovGDewyfzRnsAQbWFYWe1tQsYv8GmF1ryp96A0gkEnkburswMIk8u2XR7COWv0Vi2DeYvRGmoLHAy/pub?gid=468825690&single=true&output=csv";

    const groupsEl = document.getElementById("groups");
    const countResumenEl = document.getElementById("count-resumen");
    const viewMessageEl = document.getElementById("view-message");

    /* --- LOGICA PURA (testeable) : inicio --- */

    function cleanText(value) {
      if (value == null) return "";
      return String(value).replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizarTexto(str) {
      return cleanText(str)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    // CSV tipo RFC4180: soporta comillas, comas y saltos dentro de campos.
    function parseCsv(text) {
      const filas = [];
      let fila = [];
      let campo = "";
      let enComillas = false;
      const src = String(text).replace(/^\uFEFF/, "");

      for (let i = 0; i < src.length; i++) {
        const c = src[i];

        if (enComillas) {
          if (c === '"') {
            if (src[i + 1] === '"') { campo += '"'; i++; }
            else enComillas = false;
          } else {
            campo += c;
          }
          continue;
        }

        if (c === '"') enComillas = true;
        else if (c === ",") { fila.push(campo); campo = ""; }
        else if (c === "\n") { fila.push(campo); filas.push(fila); fila = []; campo = ""; }
        else if (c === "\r") { /* ignorar */ }
        else campo += c;
      }

      if (campo !== "" || fila.length) {
        fila.push(campo);
        filas.push(fila);
      }

      return filas;
    }

    // Cabecera de grupo: "1  (16)", "2 (16)", "Grupo 5 (15)".
    const RE_CABECERA_GRUPO = /^(?:grupo\s+)?(\d+)\s*\(\s*(\d+)\s*\)$/i;

    // Recorre la hoja y arma un grupo por cada celda-cabecera.
    // Cada cabecera guarda su columna; las filas siguientes cargan el rol o el integrante.
    function extraerGrupos(filas) {
      const grupos = [];
      let actuales = [];

      for (const fila of filas) {
        const cabeceras = [];
        fila.forEach((celda, i) => {
          const m = cleanText(celda).match(RE_CABECERA_GRUPO);
          if (m) cabeceras.push({ col: i, numero: parseInt(m[1], 10), integrantes: parseInt(m[2], 10) });
        });

        // Una fila puede iniciar varios grupos a la vez (o reemplazar el set actual).
        if (cabeceras.length) {
          actuales = cabeceras.map(c => ({
            numero: c.numero,
            integrantes: c.integrantes,
            col: c.col,
            super: "",
            aux: "",
            miembros: []
          }));
          grupos.push(...actuales);
          continue;
        }

        if (!actuales.length) continue;

        const rol = normalizarTexto(fila[0]);

        if (rol === "superintendente" || rol === "auxiliar") {
          for (const g of actuales) {
            const valor = cleanText(fila[g.col]);
            if (!valor) continue;
            if (rol === "superintendente") g.super = valor;
            else g.aux = valor;
          }
          continue;
        }

        // Integrante en la misma columna del grupo.
        for (const g of actuales) {
          const valor = cleanText(fila[g.col]);
          if (valor) g.miembros.push(valor);
        }
      }

      return grupos;
    }

    /* --- LOGICA PURA : fin --- */

    function renderLeaders(superNombre, auxNombre) {
      const items = [];
      if (superNombre) items.push({ role: "Superintendente", name: superNombre });
      if (auxNombre) items.push({ role: "Auxiliar", name: auxNombre });

      if (!items.length) return "";

      return `
        <div class="leaders">
          ${items.map(l => `
            <div class="leader">
              <span class="assign-role">${escapeHtml(l.role)}</span>
              <span class="assign-name">${escapeHtml(l.name)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderGrupo(g) {
      const miembros = g.miembros
        .map(m => `<span class="member">${escapeHtml(m)}</span>`)
        .join("");

      return `
        <article class="week-card">
          <div class="week-title">${escapeHtml("Grupo " + g.numero)}</div>

          <div class="week-meta">
            <div class="badge">
              <span class="badge-dot"></span>
              <span>${escapeHtml(g.miembros.length + " integrantes")}</span>
            </div>
          </div>

          ${renderLeaders(g.super, g.aux)}

          ${miembros ? `<div class="member-list">${miembros}</div>` : ""}
        </article>
      `;
    }

    function renderError(mensaje) {
      countResumenEl.textContent = "Error";
      viewMessageEl.textContent = "";
      groupsEl.innerHTML = `<p class="empty-msg">${escapeHtml(mensaje)}</p>`;
    }

    async function cargar() {
      countResumenEl.textContent = "Cargando…";
      viewMessageEl.textContent = "";
      groupsEl.innerHTML = "";

      let csv;
      try {
        const response = await fetch(CSV_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        csv = await response.text();
      } catch (err) {
        // Abierto como file:// el navegador bloquea el fetch (Google no manda CORS al redirect).
        const local = window.location.protocol === "file:";
        renderError(local
          ? "Para ver los grupos localmente hay que servirlo por HTTP (por ejemplo: python3 -m http.server en la carpeta del sitio)."
          : "No pude cargar los grupos. Verificá que la planilla siga publicada.");
        return;
      }

      const grupos = extraerGrupos(parseCsv(csv));

      if (!grupos.length) {
        countResumenEl.textContent = "0 grupos";
        groupsEl.innerHTML = `<p class="empty-msg">No encontré grupos en la planilla.</p>`;
        return;
      }

      countResumenEl.textContent = grupos.length === 1 ? "1 grupo" : `${grupos.length} grupos`;
      groupsEl.innerHTML = grupos.map(renderGrupo).join("");
    }

    cargar();
  </script>
</body>
</html>
